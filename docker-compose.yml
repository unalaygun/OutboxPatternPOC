services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: outbox-sqlserver
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"

  redis:
    image: redis:7-alpine
    container_name: outbox-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outbox-api
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=OutboxPatternDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      - sqlserver
      - redis
